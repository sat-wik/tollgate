[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tollgate-proxy"
version = "0.1.0"
description = "A local observe-only capture proxy for LLM API traffic, with real streaming SSE passthrough."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Satwik Pattanaik" }]
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.scripts]
tollgate = "tollgate.cli:main"

[project.urls]
Repository = "https://github.com/sat-wik/tollgate"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tollgate"]
